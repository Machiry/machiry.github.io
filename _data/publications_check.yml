# Settings for scripts/check_publications.py, which proposes new papers for
# the Publications page (_publications/index.html).

author_family: Machiry
author_display: Aravind Machiry
openalex_author: A5071486684

# Venue labels, matched in order against the venue name (put the more
# specific names first). For the ACM journal-style proceedings, the issue
# name (e.g. ISSTA, FSE) is used instead.
venues:
  - match: Dependable Systems and Networks Workshops
    label: DSN-W
  - match: Dependable Systems and Networks
    label: DSN
  - match: European Symposium on Security and Privacy
    label: EuroS&P
  - match: Symposium on Security and Privacy
    label: S&P
  - match: Network and Distributed System Security
    label: NDSS
  - match: USENIX Security
    label: USENIX Security
  - match: Asia Conference on Computer and Communications Security
    label: AsiaCCS
  - match: Computer and Communications Security
    label: CCS
  - match: Annual Computer Security Applications
    label: ACSAC
  - match: Research in Attacks, Intrusions
    label: RAID
  - match: Detection of Intrusions and Malware
    label: DIMVA
  - match: European Symposium on Research in Computer Security
    label: ESORICS
  - match: Availability, Reliability and Security
    label: ARES
  - match: International Conference on Software Engineering
    label: ICSE
  - match: Software Testing and Analysis
    label: ISSTA
  - match: Foundations of Software Engineering
    label: FSE
  - match: Automated Software Engineering
    label: ASE
  - match: Mining Software Repositories
    label: MSR
  - match: Symposium on Applied Computing
    label: SAC

