name: Check publications

# Weekly, look for newly published papers (Crossref and OpenAlex) and open a
# pull request that adds them to the Publications page.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/check_publications.py --summary "$RUNNER_TEMP/summary.md"
      - run: cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: publications-update
          commit-message: Add newly published papers
          title: New publications
          body-path: ${{ runner.temp }}/summary.md
          add-paths: |
            _publications/index.html
            _data/publications_check.yml
